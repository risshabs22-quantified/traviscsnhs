<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Travis CSNHS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B03A1E"/>
      <stop offset="1" stop-color="#8E2C1B"/>
    </linearGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F2A03D"/>
      <stop offset="1" stop-color="#E8752A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- laptop: cream bezel, dark screen so the tiger reads against it -->
  <rect x="9" y="29" width="46" height="22" rx="4.5" fill="#FBF6EE"/>
  <rect x="12.5" y="32.5" width="39" height="15" rx="2.5" fill="#2A1710"/>
  <rect x="4" y="51" width="56" height="5.5" rx="2.75" fill="#FBF6EE"/>
  <rect x="26" y="52.6" width="12" height="2.2" rx="1.1" fill="#E4CDB2"/>

  <!-- ears -->
  <path d="M18.5 17 15 5l14 6.6Z" fill="url(#fur)" stroke="#F2A03D" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M45.5 17 49 5l-14 6.6Z" fill="url(#fur)" stroke="#F2A03D" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M20 15 17.8 8l7.8 3.9Z" fill="#8E2C1B" stroke="#8E2C1B" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44 15 46.2 8l-7.8 3.9Z" fill="#8E2C1B" stroke="#8E2C1B" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- head -->
  <ellipse cx="32" cy="22.5" rx="16" ry="14.5" fill="url(#fur)"/>

  <!-- stripes -->
  <g stroke="#2A1710" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.92">
    <path d="M28 9 27 15"/>
    <path d="M32 8v6.6"/>
    <path d="M36 9 37 15"/>
    <path d="M15.5 19.5 21.6 21.7"/>
    <path d="M15.2 25.7 21.4 26.1"/>
    <path d="M48.5 19.5 42.4 21.7"/>
    <path d="M48.8 25.7 42.6 26.1"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="28.2" cy="30.4" rx="6" ry="4.4" fill="#FBF6EE"/>
  <ellipse cx="35.8" cy="30.4" rx="6" ry="4.4" fill="#FBF6EE"/>

  <!-- eyes -->
  <ellipse cx="26.6" cy="21" rx="2.3" ry="2.6" fill="#2A1710"/>
  <ellipse cx="37.4" cy="21" rx="2.3" ry="2.6" fill="#2A1710"/>
  <circle cx="27.4" cy="20.1" r="0.85" fill="#FBF6EE"/>
  <circle cx="38.2" cy="20.1" r="0.85" fill="#FBF6EE"/>

  <!-- nose -->
  <path d="M32 26.2 34.9 28.6a2.9 2.9 0 0 1-5.8 0Z" fill="#8E2C1B"/>

  <!-- prompt on screen, clear of the chin -->
  <path d="M17.5 39.5 20.8 42.4 17.5 45.3" fill="none" stroke="#F2A03D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24.5" y="43.2" width="12" height="2.4" rx="1.2" fill="#E8752A"/>
</svg>
