<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Travis CSNHS">
  <rect width="64" height="64" rx="15" fill="#8E2C1B"/>

  <!-- laptop: pale bezel, dark screen so the tiger reads against it -->
  <rect x="9" y="29" width="46" height="22" rx="4.5" fill="#FBF2E8"/>
  <rect x="12.5" y="32.5" width="39" height="15" rx="2.5" fill="#241611"/>
  <rect x="4" y="51" width="56" height="5.5" rx="2.75" fill="#FBF2E8"/>
  <rect x="26" y="52.6" width="12" height="2.2" rx="1.1" fill="#E5D3BC"/>

  <!-- ears -->
  <path d="M18.5 17 15 5l14 6.6Z" fill="#E8752A" stroke="#E8752A" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M45.5 17 49 5l-14 6.6Z" fill="#E8752A" stroke="#E8752A" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M20 15 17.8 8l7.8 3.9Z" fill="#8E2C1B" stroke="#8E2C1B" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44 15 46.2 8l-7.8 3.9Z" fill="#8E2C1B" stroke="#8E2C1B" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- head -->
  <ellipse cx="32" cy="22.5" rx="16" ry="14.5" fill="#E8752A"/>

  <!-- stripes -->
  <g stroke="#241611" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M28 9 27 15"/>
    <path d="M32 8v6.6"/>
    <path d="M36 9 37 15"/>
    <path d="M15.5 19.5 21.6 21.7"/>
    <path d="M15.2 25.7 21.4 26.1"/>
    <path d="M48.5 19.5 42.4 21.7"/>
    <path d="M48.8 25.7 42.6 26.1"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="28.2" cy="30.4" rx="6" ry="4.4" fill="#FBF2E8"/>
  <ellipse cx="35.8" cy="30.4" rx="6" ry="4.4" fill="#FBF2E8"/>

  <!-- eyes -->
  <ellipse cx="26.6" cy="21" rx="2.3" ry="2.6" fill="#241611"/>
  <ellipse cx="37.4" cy="21" rx="2.3" ry="2.6" fill="#241611"/>
  <circle cx="27.4" cy="20.1" r="0.85" fill="#FBF2E8"/>
  <circle cx="38.2" cy="20.1" r="0.85" fill="#FBF2E8"/>

  <!-- nose -->
  <path d="M32 26.2 34.9 28.6a2.9 2.9 0 0 1-5.8 0Z" fill="#8E2C1B"/>

  <!-- prompt on screen, clear of the chin -->
  <path d="M17.5 39.5 20.8 42.4 17.5 45.3" fill="none" stroke="#E8752A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24.5" y="43.2" width="12" height="2.4" rx="1.2" fill="#E8752A"/>
</svg>
